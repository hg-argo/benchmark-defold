name: Build & release

on:
  push:
    branches:
      - ci # @todo Remove after testing
      - master
      - main
      - release

env:
  BOB_VERSION: "1.11.2"
  JAVA_VERSION: "21"

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: web
            platform: js-web

          - id: macos
            platform: x86_64-macos

          - id: macos-silicon
            platform: arm64-macos

          - id: windows
            platform: x86_64-win32
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      
      # Bob is the build tool provided by Defold: https://defold.com/manuals/bob
      - name: Download bob.jar
        run: |
          curl -L -o bob.jar \
            https://github.com/defold/defold/releases/download/${{ env.BOB_VERSION }}/bob.jar
      
      - name: Resolve dependencies
        run: java -jar bob.jar resolve

      - name: Build ${{ matrix.id }}
        run: |
          java -jar bob.jar build --platform ${{ matrix.platform }} --archive --bundle-output build

      - name: Upload ${{ matrix.id }} artifact
        uses: actions/upload-artifact@v6
        with:
          name: artifact/${{ matrix.platform }}
          path: build/default

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    strategy:
      matrix:
        include:
          - id: web
            platform: js-web
            zip: roids-web.zip

          - id: macos
            platform: x86_64-macos
            zip: roids-mac.zip

          - id: macos-silicon
            platform: arm64-macos
            zip: roids-mac-silicon.zip

          - id: windows
            platform: x86_64-win32
            zip: windows.zip

    steps:
      # Create a Release entry
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: artifact

      - name: ZIP ${{ matrix.id }} build
        run: |
          cd artifact/${{ matrix.platform }}
          zip -r $GITHUB_WORKSPACE/${{ matrix.zip }} .
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            roids-html5.zip
            roids-macos.zip
            roids-macos-silicon.zip
            roids-windows.zip

      # Deploy Web version to GitHub Pages
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifact/html5

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4